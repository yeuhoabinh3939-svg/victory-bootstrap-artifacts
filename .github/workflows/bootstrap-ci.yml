name: Audited public bootstrap CI

on:
  push:
    paths:
      - '.github/workflows/bootstrap-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-bootstrap-ci
  cancel-in-progress: false

jobs:
  audit-test-build:
    if: github.repository == 'yeuhoabinh3939-svg/victory-bootstrap-artifacts' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify immutable source, test and build reproducible public artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib, io, json, os, pathlib, re, subprocess, sys, tarfile, urllib.request
          commit = '9e8d84e181cd2f8e2c8eb15db997f0d62ddba577'
          root_url = 'https://raw.githubusercontent.com/yeuhoabinh3939-svg/victory-bootstrap-artifacts/' + commit + '/'
          pins = {
              'README.md': (1764, '2b4ce819f0c67c9d0672dd4b43362ffab9ed3af78159a0a39a16eaec0cf55fb5'),
              'bootstrap.py': (11515, '7849aa31073318ccacaa3548388ffae74ce2058f22dc67492e6ed7d8a2ac5e9b'),
              'dependencies.json': (253, '91fa040d42386e71e1e7879a1c19ca6265bdbcd93ae9959e5b8353bf72a54da1'),
              'tests/test_bootstrap.py': (6679, '5159c9698aef766748cbebe3ba4c50fec752ff332c5e8295787cc9e480408eed'),
              'SHA256SUMS': (329, '4fff7770f92655d67e6dd5c6d94e1c3666870d50af6841fde75f36f07ea77ebf'),
          }
          folder = pathlib.Path('audited-source')
          folder.mkdir()
          files = {}
          patterns = [rb'-----BEGIN (?:OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----', rb'gh[pousr]_[A-Za-z0-9]{20,}', rb'github_pat_[A-Za-z0-9_]{20,}', rb'AKIA[A-Z0-9]{16}', rb'sk-[A-Za-z0-9]{20,}']
          for name, (size, digest) in pins.items():
              url = root_url + name
              with urllib.request.urlopen(url, timeout=20) as response:
                  body = response.read(size + 1)
                  if response.geturl() != url or len(body) != size or hashlib.sha256(body).hexdigest() != digest:
                      raise ValueError('IMMUTABLE_SOURCE_HASH_MISMATCH')
              if any(re.search(pattern, body) for pattern in patterns):
                  raise ValueError('SECRET_PATTERN_FOUND')
              files[name] = body
              target = folder / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(body)
          dependencies = json.loads(files['dependencies.json'])
          if dependencies['python_packages'] or dependencies['installs_or_upgrades'] or dependencies['model_calls'] != 0:
              raise ValueError('DEPENDENCY_OR_MODEL_SCOPE_CHANGED')
          result = subprocess.run([sys.executable, '-I', '-B', 'tests/test_bootstrap.py'], cwd=folder, capture_output=True, timeout=60)
          report = result.stderr.decode('utf-8', errors='replace')
          print(report)
          if result.returncode or not re.search(r'Ran 21 tests\b', report) or '\nOK\n' not in report:
              raise ValueError('PUBLIC_LINUX_CI_TESTS_NOT_PASS')
          manifest = {'source_commit': commit, 'scope': 'five public generic files only; not a VPS install', 'files': {name: {'bytes': len(body), 'sha256': hashlib.sha256(body).hexdigest()} for name, body in sorted(files.items())}}
          manifest_raw = (json.dumps(manifest, sort_keys=True, indent=2) + '\n').encode()
          files['PUBLIC_MANIFEST.json'] = manifest_raw
          artifact = pathlib.Path('public-bootstrap.tar')
          with tarfile.open(artifact, 'x', format=tarfile.USTAR_FORMAT) as archive:
              for name, body in sorted(files.items()):
                  item = tarfile.TarInfo(name)
                  item.size = len(body)
                  item.mode = 0o444
                  item.mtime = 0
                  item.uid = item.gid = 0
                  item.uname = item.gname = ''
                  archive.addfile(item, io.BytesIO(body))
          receipt = {'status': 'PUBLIC_CI_LINUX_21_PASS_ARTIFACT_BUILT', 'source_commit': commit, 'artifact_bytes': artifact.stat().st_size, 'artifact_sha256': hashlib.sha256(artifact.read_bytes()).hexdigest(), 'manifest_sha256': hashlib.sha256(manifest_raw).hexdigest(), 'vps_deployed': False, 'model_calls': 0, 'artifact_uploaded': False}
          pathlib.Path('PUBLIC_BUILD_RECEIPT.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Public bootstrap CI only. No VPS connection or deployment.\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PY

# No secrets, third-party actions, paid runners, artifact upload, cache or VPS access.
# Build output is ephemeral; its manifest/digest remain in job logs/summary.
# Deployment requires a separately verified DEV channel and protected Environment.
